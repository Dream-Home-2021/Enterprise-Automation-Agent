<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Agent</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<style>
/* ── Reset ─────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
  background: #212121;
  color: #e0e0e0;
  display: flex;
  height: 100vh;
}

/* ── Scrollbar ─────────────────────────────── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

/* ── Sidebar ───────────────────────────────── */
#sidebar {
  width: 260px;
  min-width: 260px;
  background: #171717;
  display: flex;
  flex-direction: column;
  border-right: 1px solid rgba(255,255,255,0.06);
  height: 100vh;
}
#sidebar-header {
  padding: 16px 14px 8px;
  font-size: 13px;
  color: #888;
  font-weight: 600;
  letter-spacing: 0.5px;
}
#new-chat-btn {
  margin: 4px 10px 10px;
  padding: 10px 14px;
  background: transparent;
  color: #e0e0e0;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: background 0.15s;
}
#new-chat-btn:hover { background: rgba(255,255,255,0.06); }
#new-chat-btn svg { width: 16px; height: 16px; opacity: 0.7; }

#session-list {
  flex: 1;
  overflow-y: auto;
  padding: 0 8px;
}
.session-item {
  display: flex;
  align-items: center;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.12s;
  margin: 1px 0;
  position: relative;
  gap: 8px;
}
.session-item:hover { background: rgba(255,255,255,0.06); }
.session-item.active {
  background: rgba(99,102,241,0.12);
  color: #e0e0ff;
}
.session-item .icon { font-size: 14px; flex-shrink: 0; }
.session-item .name {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 13px;
}
.session-item .del-btn {
  opacity: 0;
  width: 24px;
  height: 24px;
  border: none;
  background: transparent;
  color: #888;
  cursor: pointer;
  border-radius: 6px;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.12s;
}
.session-item:hover .del-btn { opacity: 0.6; }
.session-item .del-btn:hover { opacity: 1; background: rgba(255,255,255,0.08); color: #ef4444; }

#sidebar-footer {
  padding: 10px;
  border-top: 1px solid rgba(255,255,255,0.06);
}

/* ── Main Chat Area ────────────────────────── */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  background: #181818;
  position: relative;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 0;
  scroll-behavior: smooth;
}

/* Welcome screen */
#welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 40px 20px;
  text-align: center;
}
#welcome .logo { font-size: 48px; margin-bottom: 16px; }
#welcome h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; color: #e0e0e0; }
#welcome p { color: #888; font-size: 14px; max-width: 400px; line-height: 1.6; }

/* Message bubbles */
.message-container {
  max-width: 768px;
  margin: 0 auto;
  padding: 0 24px;
}
.message-row {
  padding: 16px 0;
  display: flex;
  gap: 12px;
}
.message-row.user-row {
  /* user messages */
}
.message-row.ai-row {
  /* ai messages */
}
.message-row .avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  flex-shrink: 0;
  background: #2f2f2f;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  overflow: hidden;
}
.message-row .avatar img { width: 100%; height: 100%; object-fit: cover; }
.message-row .avatar.user-avatar { background: #6366f1; }
.message-row .content {
  flex: 1;
  min-width: 0;
  line-height: 1.7;
  font-size: 15px;
  color: #e0e0e0;
  white-space: pre-wrap;
  word-wrap: break-word;
}
.message-row .content p { margin-bottom: 8px; }
.message-row .content p:last-child { margin-bottom: 0; }
.message-row .content code {
  background: rgba(255,255,255,0.06);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 13px;
  font-family: "JetBrains Mono", "Fira Code", monospace;
}
.message-row .content pre {
  background: rgba(0,0,0,0.3);
  padding: 14px 16px;
  border-radius: 8px;
  overflow-x: auto;
  margin: 8px 0;
  border: 1px solid rgba(255,255,255,0.06);
}
.message-row .content pre code {
  background: none;
  padding: 0;
  font-size: 13px;
}
.message-row .content ul, .message-row .content ol {
  padding-left: 20px;
  margin: 6px 0;
}
.message-row .content li { margin: 2px 0; }

/* User message styling */
.user-row .content {
  background: #2f2f2f;
  padding: 12px 16px;
  border-radius: 16px 16px 4px 16px;
  max-width: 70%;
  margin-left: auto;
}
.user-row { justify-content: flex-end; }
.user-row .avatar { order: 1; margin-left: 0; }

/* AI message styling */
.ai-row .content {
  padding: 0 4px;
}

/* Typing indicator */
#typing-indicator {
  display: none;
  padding: 16px 0;
}
#typing-indicator.active { display: flex; }
#typing-indicator .dots { display: flex; gap: 4px; padding: 8px 0; }
#typing-indicator .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #6366f1;
  animation: bounce 1.4s infinite ease-in-out;
}
#typing-indicator .dot:nth-child(2) { animation-delay: 0.16s; }
#typing-indicator .dot:nth-child(3) { animation-delay: 0.32s; }
@keyframes bounce {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}

/* ── Input Area ────────────────────────────── */
#input-area {
  padding: 16px 24px 24px;
  max-width: 768px;
  margin: 0 auto;
  width: 100%;
}
#input-wrapper {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  background: #2f2f2f;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 8px 8px 8px 16px;
  transition: border-color 0.2s;
}
#input-wrapper:focus-within {
  border-color: rgba(99,102,241,0.4);
}
#message-input {
  flex: 1;
  border: none;
  background: transparent;
  color: #e0e0e0;
  font-size: 15px;
  font-family: inherit;
  line-height: 1.5;
  resize: none;
  outline: none;
  max-height: 200px;
  min-height: 24px;
}
#message-input::placeholder { color: #666; }
#send-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: #6366f1;
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
  flex-shrink: 0;
}
#send-btn:hover { background: #4f46e5; }
#send-btn:disabled { background: #333; cursor: not-allowed; opacity: 0.5; }
#send-btn svg { width: 18px; height: 18px; }

/* ── Loading ───────────────────────────────── */
#loading-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
#loading-overlay.active { display: flex; }
#loading-overlay .spinner {
  width: 40px;
  height: 40px;
  border: 3px solid rgba(255,255,255,0.1);
  border-top-color: #6366f1;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Message actions ───────────────────────── */
.message-actions { display: none; margin-top: 8px; gap: 6px; }
.ai-row:hover .message-actions { display: flex; }
.message-actions button {
  background: transparent;
  border: none;
  color: #666;
  cursor: pointer;
  font-size: 12px;
  padding: 2px 6px;
  border-radius: 4px;
  transition: all 0.1s;
}
.message-actions button:hover { background: rgba(255,255,255,0.06); color: #999; }

/* ── Responsive ────────────────────────────── */
@media (max-width: 768px) {
  #sidebar { display: none; }
  #sidebar.active { display: flex; position: fixed; z-index: 100; width: 280px; }
  #mobile-menu-btn { display: flex !important; }
  .message-container { padding: 0 12px; }
  #input-area { padding: 12px 12px 16px; }
  .message-row .content { font-size: 14px; }
}

/* ── Mobile menu toggle ────────────────────── */
#mobile-menu-btn {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 50;
  background: #2f2f2f;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 8px;
  cursor: pointer;
  color: #e0e0e0;
  align-items: center;
  justify-content: center;
}
#mobile-menu-btn svg { width: 20px; height: 20px; }

/* ── Copy toast ────────────────────────────── */
.toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  background: #2f2f2f;
  color: #e0e0e0;
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 13px;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  z-index: 999;
}
.toast.show { opacity: 1; }

/* ── Error message ─────────────────────────── */
.error-banner {
  display: none;
  background: rgba(239,68,68,0.1);
  border: 1px solid rgba(239,68,68,0.2);
  color: #fca5a5;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 13px;
  margin: 8px auto;
  max-width: 600px;
  text-align: center;
}
.error-banner.active { display: block; }
</style>
</head>
<body>

<!-- Mobile Menu Button -->
<button id="mobile-menu-btn" onclick="toggleSidebar()" aria-label="菜单">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M3 12h18M3 6h18M3 18h18"/>
  </svg>
</button>

<!-- Loading Overlay -->
<div id="loading-overlay"><div class="spinner"></div></div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Sidebar -->
<aside id="sidebar">
  <div id="sidebar-header">💬 会话</div>
  <button id="new-chat-btn" onclick="createSession()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 5v14M5 12h14"/>
    </svg>
    新会话
  </button>
  <div id="session-list"></div>
  <div id="sidebar-footer">
    <small style="color:#555;font-size:11px;padding:0 4px;">My Agent</small>
  </div>
</aside>

<!-- Main -->
<main id="main">
  <div id="messages">
    <div id="welcome">
      <div class="logo">🤖</div>
      <h1>有什么可以帮助你的？</h1>
      <p>在下方输入你的问题，我可以帮你解答、分析、写作、编程等。</p>
    </div>
  </div>

  <div id="input-area">
    <div id="error-banner" class="error-banner"></div>
    <div id="input-wrapper">
      <textarea id="message-input" rows="1" placeholder="输入消息..." onkeydown="onInputKeydown(event)" oninput="autoResize(this)"></textarea>
      <button id="send-btn" onclick="sendMessage()" aria-label="发送">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</main>

<script>
// ── State ──────────────────────────────────────────────────────────
let state = {
  sessions: [],
  currentSessionId: null,
  isStreaming: false,
  abortController: null,
};

// ── DOM refs ───────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const messagesEl = $('messages');
const welcomeEl = $('welcome');
const sessionListEl = $('session-list');
const messageInput = $('message-input');
const sendBtn = $('send-btn');
const loadingOverlay = $('loading-overlay');
const toastEl = $('toast');

// ── Init ───────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', initApp);
messageInput.focus();

async function initApp() {
  showLoading(true);
  try {
    const data = await apiGet('/api/init');
    state.sessions = data.sessions;
    state.currentSessionId = data.current_session_id;
    renderSessions();
    if (data.history && data.history.length > 0) {
      renderHistory(data.history);
    }
  } catch (e) {
    showError('加载失败: ' + e.message);
  } finally {
    showLoading(false);
    messageInput.focus();
  }
}

// ── API ────────────────────────────────────────────────────────────
async function apiGet(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function apiPost(url, body) {
  const res = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function apiDelete(url) {
  const res = await fetch(url, { method: 'DELETE' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ── Sessions CRUD ──────────────────────────────────────────────────
function renderSessions() {
  sessionListEl.innerHTML = '';
  state.sessions.forEach(s => {
    const div = document.createElement('div');
    div.className = 'session-item' + (s.id === state.currentSessionId ? ' active' : '');
    div.dataset.id = s.id;

    const icon = document.createElement('span');
    icon.className = 'icon';
    icon.textContent = '📝';

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = s.name || '新会话';

    const delBtn = document.createElement('button');
    delBtn.className = 'del-btn';
    delBtn.innerHTML = '✕';
    delBtn.title = '删除会话';
    delBtn.onclick = (e) => {
      e.stopPropagation();
      deleteSession(s.id);
    };

    div.appendChild(icon);
    div.appendChild(name);
    div.appendChild(delBtn);
    div.onclick = () => switchSession(s.id);
    sessionListEl.appendChild(div);
  });
}

async function createSession() {
  showLoading(true);
  try {
    const data = await apiPost('/api/sessions', {});
    state.sessions = data.sessions;
    state.currentSessionId = data.session_id;
    renderSessions();
    clearMessages();
    welcomeEl.style.display = 'flex';
    scrollToBottom();
  } catch (e) {
    showError('创建会话失败: ' + e.message);
  } finally {
    showLoading(false);
    messageInput.focus();
  }
}

async function switchSession(sessionId) {
  if (sessionId === state.currentSessionId) return;
  state.currentSessionId = sessionId;
  renderSessions();
  clearMessages();
  showLoading(true);
  try {
    const data = await apiGet(`/api/sessions/${sessionId}/history`);
    if (data.history && data.history.length > 0) {
      renderHistory(data.history);
    } else {
      welcomeEl.style.display = 'flex';
    }
    scrollToBottom();
  } catch (e) {
    showError('加载历史失败: ' + e.message);
  } finally {
    showLoading(false);
    messageInput.focus();
  }
}

async function deleteSession(sessionId) {
  if (!confirm('确定要删除这个会话吗？')) return;
  showLoading(true);
  try {
    const data = await apiDelete(`/api/sessions/${sessionId}`);
    state.sessions = data.sessions;
    state.currentSessionId = data.session_id;
    renderSessions();
    clearMessages();
    if (data.history && data.history.length > 0) {
      renderHistory(data.history);
    } else {
      welcomeEl.style.display = 'flex';
    }
    scrollToBottom();
  } catch (e) {
    showError('删除失败: ' + e.message);
  } finally {
    showLoading(false);
  }
}

// ── Message rendering ──────────────────────────────────────────────
function renderHistory(history) {
  welcomeEl.style.display = 'none';
  history.forEach(msg => {
    if (msg.role === 'user' || msg.role === 'assistant') {
      appendMessage(msg.role, msg.content);
    }
  });
}

function appendMessage(role, content, isStreaming = false) {
  welcomeEl.style.display = 'none';

  // Find or create message container
  let container = document.querySelector('.message-container');
  if (!container) {
    container = document.createElement('div');
    container.className = 'message-container';
    messagesEl.appendChild(container);
  }

  // Check if we should update existing AI message (streaming)
  if (isStreaming && role === 'assistant') {
    const lastRow = container.querySelector('.message-row.ai-row:last-child');
    if (lastRow) {
      const contentEl = lastRow.querySelector('.content');
      if (contentEl) {
        contentEl.textContent = content;
        scrollToBottom();
        return;
      }
    }
  }

  const row = document.createElement('div');
  row.className = `message-row ${role === 'user' ? 'user-row' : 'ai-row'}`;

  // Avatar
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  if (role === 'assistant') {
    avatar.innerHTML = '<img src="/images/ai.png" alt="AI" onerror="this.outerHTML=\'🤖\'">';
  } else {
    avatar.innerHTML = '<img src="/images/user.png" alt="User" onerror="this.outerHTML=\'👤\'">';
    avatar.classList.add('user-avatar');
  }

  // Content
  const contentEl = document.createElement('div');
  contentEl.className = 'content';
  contentEl.textContent = content;

  if (role === 'assistant') {
    row.appendChild(avatar);

    // Actions
    const actions = document.createElement('div');
    actions.className = 'message-actions';
    const copyBtn = document.createElement('button');
    copyBtn.textContent = '复制';
    copyBtn.onclick = () => copyText(content);
    actions.appendChild(copyBtn);
    contentEl.appendChild(actions);
  }

  row.appendChild(contentEl);
  if (role === 'user') {
    row.appendChild(avatar);
  }
  container.appendChild(row);
  scrollToBottom();
}

function clearMessages() {
  const container = document.querySelector('.message-container');
  if (container) container.remove();
  // Remove typing indicator
  const typing = document.getElementById('typing-indicator');
  if (typing) typing.remove();
}

// ── Send message (SSE streaming) ───────────────────────────────────
async function sendMessage() {
  const msg = messageInput.value.trim();
  if (!msg || state.isStreaming || !state.currentSessionId) return;

  // Reset
  messageInput.value = '';
  autoResize(messageInput);
  hideError();
  setStreamingState(true);

  // Append user message
  appendMessage('user', msg);

  // Get current history for context
  const history = getCurrentHistory();

  // Create empty AI row to receive streaming chunks
  appendMessage('assistant', '', true);

  try {
    const response = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        message: msg,
        session_id: state.currentSessionId,
        user_id: 1,
        history: history,
      }),
    });

    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try {
            const data = JSON.parse(line.slice(6));
            handleSSEEvent(data);
          } catch (e) {
            // skip malformed
          }
        }
      }
    }
  } catch (e) {
    showError('发送失败: ' + e.message);
  } finally {
    setStreamingState(false);
    messageInput.focus();
  }
}

function appendStreamChunk(delta) {
  const container = document.querySelector('.message-container');
  if (!container) return;
  let lastRow = container.querySelector('.message-row.ai-row:last-child');
  if (!lastRow) {
    appendMessage('assistant', delta, true);
    return;
  }
  const contentEl = lastRow.querySelector('.content');
  if (!contentEl) return;
  const actions = contentEl.querySelector('.message-actions');
  if (actions) actions.remove();
  contentEl.textContent += delta;
  if (actions) contentEl.appendChild(actions);
  scrollToBottom();
}

function handleSSEEvent(data) {
  switch (data.type) {
    case 'chunk':
      // Append delta to the last AI message
      appendStreamChunk(data.content);
      break;
    case 'title':
      // Update session list with new titles
      if (data.sessions) {
        state.sessions = data.sessions;
        renderSessions();
      }
      break;
    case 'done':
      // Stream completed
      break;
    case 'error':
      showError(data.message || '服务器错误');
      break;
  }
}

function setStreamingState(streaming) {
  state.isStreaming = streaming;
  sendBtn.disabled = streaming;
  messageInput.disabled = streaming;
  if (!streaming) {
    messageInput.focus();
  }
}

// ── Helpers ────────────────────────────────────────────────────────
function getCurrentHistory() {
  const container = document.querySelector('.message-container');
  if (!container) return [];
  const rows = container.querySelectorAll('.message-row');
  const history = [];
  rows.forEach(row => {
    const isAI = row.classList.contains('ai-row');
    const contentEl = row.querySelector('.content');
    if (contentEl) {
      history.push({
        role: isAI ? 'assistant' : 'user',
        content: contentEl.textContent,
      });
    }
  });
  return history;
}

function scrollToBottom() {
  setTimeout(() => {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }, 10);
}

function showLoading(show) {
  loadingOverlay.classList.toggle('active', show);
}

function showError(msg) {
  const banner = $('error-banner');
  banner.textContent = msg;
  banner.classList.add('active');
}

function hideError() {
  $('error-banner').classList.remove('active');
}

function onInputKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(textarea) {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    showToast('已复制');
  } catch {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    showToast('已复制');
  }
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2000);
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('active');
}
</script>
</body>
</html>

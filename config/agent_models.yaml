agents:
  profile_extract_agent:
    provider: openrouter
    model_config:
      # 会话内容偏好提取——低温度保证提取一致性
      model: nvidia/nemotron-3-super-120b-a12b:free
      temperature: 0.1
    max_iterations: 3
  session_title_agent:
    provider: openrouter
    model_config:
      # 会话标题生成——轻量、快速、低温度保证确定性
      model: nvidia/nemotron-3-super-120b-a12b:free
      temperature: 0.3
    max_iterations: 3
